<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תרשים זרימת מסכים - ללא מנויים</title>
  <style>
    :root {
      --bg: #f4f7fc;
      --card: #ffffff;
      --text: #20354f;
      --muted: #5f738d;
      --line: #485f7a;
      --lp-fill: #fff7cc;
      --lp-stroke: #a68d2c;
      --auth-fill: #e6f5e8;
      --auth-stroke: #6caa74;
      --producer-fill: #deebf8;
      --producer-stroke: #6d95bf;
      --coord-fill: #efe3fb;
      --coord-stroke: #9e7fc8;
      --admin-fill: #ffedd9;
      --admin-stroke: #d8a164;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 14px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg), #eaf1fb);
      color: var(--text);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid #d7e3f2;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 10px 28px rgba(16, 38, 64, 0.1);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 30px;
      color: #1f4a74;
    }

    .sub {
      margin: 8px 0 12px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid #d7e2ef;
      border-radius: 10px;
      background: #fcfeff;
    }

    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
      justify-content: center;
      font-size: 13px;
      color: #4d6482;
    }

    .sw {
      width: 12px;
      height: 12px;
      display: inline-block;
      border-radius: 2px;
      margin-left: 6px;
      vertical-align: middle;
      border: 1px solid rgba(0, 0, 0, 0.2);
    }

    .caption {
      margin-top: 10px;
      text-align: center;
      color: #4e6483;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>תרשים זרימת מסכים</h1>
    <p class="sub">גרסה מעודכנת: ללא מנויים, ובדשבורד מנהלת רק אישור/דחייה/מחיקה של תוכניות</p>

    <svg viewBox="0 0 1500 980" xmlns="http://www.w3.org/2000/svg" aria-label="Screen flow diagram without subscriptions">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
          <polygon points="0 0, 10 3, 0 6" fill="#485f7a" />
        </marker>
      </defs>

      <!-- Legend -->
      <rect x="25" y="58" width="175" height="150" rx="8" fill="#fff" stroke="#c7d6e8" />
      <text x="112" y="85" text-anchor="middle" font-size="15" font-weight="700" fill="#2f4b6a">מקרא</text>
      <rect x="45" y="100" width="18" height="12" fill="var(--lp-fill)" stroke="var(--lp-stroke)" />
      <text x="120" y="111" text-anchor="middle" font-size="13" fill="#48627f">דף צופה</text>
      <rect x="45" y="125" width="18" height="12" fill="var(--auth-fill)" stroke="var(--auth-stroke)" />
      <text x="126" y="136" text-anchor="middle" font-size="13" fill="#48627f">הרשמה/התחברות</text>
      <rect x="45" y="150" width="18" height="12" fill="var(--producer-fill)" stroke="var(--producer-stroke)" />
      <text x="126" y="161" text-anchor="middle" font-size="13" fill="#48627f">מסך מפיקה</text>
      <rect x="45" y="175" width="18" height="12" fill="var(--coord-fill)" stroke="var(--coord-stroke)" />
      <text x="112" y="186" text-anchor="middle" font-size="13" fill="#48627f">מסך רכזת</text>
      <rect x="45" y="200" width="18" height="12" fill="var(--admin-fill)" stroke="var(--admin-stroke)" />
      <text x="110" y="211" text-anchor="middle" font-size="13" fill="#48627f">מסך מנהלת</text>

      <!-- Top -->
      <rect x="620" y="40" width="260" height="84" rx="10" fill="var(--lp-fill)" stroke="var(--lp-stroke)" stroke-width="2" />
      <text x="750" y="75" text-anchor="middle" font-size="25" font-weight="700" fill="#2c3f56">דף הבית</text>
      <text x="750" y="104" text-anchor="middle" font-size="20" font-weight="700" fill="#2c3f56">Landing Page</text>

      <!-- Auth -->
      <rect x="610" y="200" width="280" height="82" rx="10" fill="var(--auth-fill)" stroke="var(--auth-stroke)" stroke-width="2" />
      <text x="750" y="232" text-anchor="middle" font-size="23" font-weight="700" fill="#2c3f56">התחברות</text>
      <text x="750" y="257" text-anchor="middle" font-size="20" font-weight="700" fill="#2c3f56">Login</text>

      <rect x="1000" y="200" width="230" height="82" rx="10" fill="var(--auth-fill)" stroke="var(--auth-stroke)" stroke-width="2" />
      <text x="1115" y="232" text-anchor="middle" font-size="23" font-weight="700" fill="#2c3f56">הרשמה</text>
      <text x="1115" y="257" text-anchor="middle" font-size="20" font-weight="700" fill="#2c3f56">Register</text>

      <!-- Coordinator -->
      <rect x="250" y="200" width="230" height="82" rx="10" fill="var(--coord-fill)" stroke="var(--coord-stroke)" stroke-width="2" />
      <text x="365" y="238" text-anchor="middle" font-size="22" font-weight="700" fill="#2c3f56">גלריית תוכניות</text>
      <text x="365" y="262" text-anchor="middle" font-size="19" font-weight="700" fill="#2c3f56">(לצפייה)</text>

      <rect x="250" y="390" width="230" height="82" rx="10" fill="var(--coord-fill)" stroke="var(--coord-stroke)" stroke-width="2" />
      <text x="365" y="437" text-anchor="middle" font-size="22" font-weight="700" fill="#2c3f56">דף תוכנית בודדת</text>

      <!-- Producer -->
      <rect x="990" y="390" width="240" height="82" rx="10" fill="var(--producer-fill)" stroke="var(--producer-stroke)" stroke-width="2" />
      <text x="1110" y="436" text-anchor="middle" font-size="23" font-weight="700" fill="#2c3f56">דשבורד מפיקה</text>

      <rect x="850" y="600" width="190" height="78" rx="10" fill="var(--producer-fill)" stroke="var(--producer-stroke)" stroke-width="2" />
      <text x="945" y="647" text-anchor="middle" font-size="21" font-weight="700" fill="#2c3f56">הוספת תוכנית</text>

      <rect x="1065" y="600" width="190" height="78" rx="10" fill="var(--producer-fill)" stroke="var(--producer-stroke)" stroke-width="2" />
      <text x="1160" y="647" text-anchor="middle" font-size="21" font-weight="700" fill="#2c3f56">עריכת תוכנית</text>

      <rect x="1280" y="600" width="190" height="78" rx="10" fill="var(--producer-fill)" stroke="var(--producer-stroke)" stroke-width="2" />
      <text x="1375" y="647" text-anchor="middle" font-size="21" font-weight="700" fill="#2c3f56">מחיקת תוכנית</text>

      <!-- Admin -->
      <rect x="610" y="760" width="280" height="82" rx="10" fill="var(--admin-fill)" stroke="var(--admin-stroke)" stroke-width="2" />
      <text x="750" y="807" text-anchor="middle" font-size="24" font-weight="700" fill="#2c3f56">דשבורד מנהלת מערכת</text>

      <rect x="440" y="885" width="190" height="72" rx="10" fill="var(--admin-fill)" stroke="var(--admin-stroke)" stroke-width="2" />
      <text x="535" y="928" text-anchor="middle" font-size="20" font-weight="700" fill="#2c3f56">אישור תוכניות</text>

      <rect x="655" y="885" width="190" height="72" rx="10" fill="var(--admin-fill)" stroke="var(--admin-stroke)" stroke-width="2" />
      <text x="750" y="928" text-anchor="middle" font-size="20" font-weight="700" fill="#2c3f56">דחיית תוכניות</text>

      <rect x="870" y="885" width="190" height="72" rx="10" fill="var(--admin-fill)" stroke="var(--admin-stroke)" stroke-width="2" />
      <text x="965" y="928" text-anchor="middle" font-size="20" font-weight="700" fill="#2c3f56">מחיקת תוכניות</text>

      <!-- Arrows -->
      <line x1="750" y1="124" x2="750" y2="200" stroke="var(--line)" stroke-width="2" marker-end="url(#arrow)" />
      <text x="772" y="165" class="txt" font-size="13" fill="#516983">התחברות</text>

      <line x1="840" y1="124" x2="1060" y2="200" stroke="var(--line)" stroke-width="2" marker-end="url(#arrow)" />
      <text x="975" y="160" font-size="13" fill="#516983">הרשמה</text>

      <line x1="660" y1="124" x2="420" y2="200" stroke="var(--line)" stroke-width="2" marker-end="url(#arrow)" />
      <text x="520" y="160" font-size="13" fill="#516983">כניסה ישירה לרכזת</text>

      <line x1="1000" y1="242" x2="890" y2="242" stroke="var(--line)" stroke-width="2" marker-end="url(#arrow)" />
      <text x="943" y="226" font-size="13" fill="#516983">אישור</text>

      <line x1="750" y1="282" x2="1110" y2="390" stroke="var(--line)" stroke-width="2" marker-end="url(#arrow)" />
      <text x="920" y="338" font-size="13" fill="#516983">מפיקה</text>

      <line x1="365" y1="282" x2="365" y2="390" stroke="var(--line)" stroke-width="2" marker-end="url(#arrow)" />

      <line x1="1110" y1="472" x2="945" y2="600" stroke="var(--line)" stroke-width="2" marker-end="url(#arrow)" />
      <line x1="1110" y1="472" x2="1160" y2="600" stroke="var(--line)" stroke-width="2" marker-end="url(#arrow)" />
      <line x1="1110" y1="472" x2="1375" y2="600" stroke="var(--line)" stroke-width="2" marker-end="url(#arrow)" />

      <line x1="750" y1="282" x2="750" y2="760" stroke="var(--line)" stroke-width="2" marker-end="url(#arrow)" />
      <text x="772" y="540" font-size="13" fill="#516983">מנהל</text>

      <line x1="750" y1="842" x2="535" y2="885" stroke="var(--line)" stroke-width="2" marker-end="url(#arrow)" />
      <line x1="750" y1="842" x2="750" y2="885" stroke="var(--line)" stroke-width="2" marker-end="url(#arrow)" />
      <line x1="750" y1="842" x2="965" y2="885" stroke="var(--line)" stroke-width="2" marker-end="url(#arrow)" />
    </svg>

    <div class="legend">
      <span><span class="sw" style="background:var(--lp-fill);border-color:var(--lp-stroke)"></span>דף צופה</span>
      <span><span class="sw" style="background:var(--auth-fill);border-color:var(--auth-stroke)"></span>הרשמה/התחברות</span>
      <span><span class="sw" style="background:var(--producer-fill);border-color:var(--producer-stroke)"></span>מסך מפיקה</span>
      <span><span class="sw" style="background:var(--coord-fill);border-color:var(--coord-stroke)"></span>מסך רכזת</span>
      <span><span class="sw" style="background:var(--admin-fill);border-color:var(--admin-stroke)"></span>מסך מנהלת</span>
    </div>

    <div class="caption">התרשים עודכן: אין מסך או זרימה של מנוי, ומנהלת אחראית רק על אישור, דחייה ומחיקה של תוכניות.</div>
  </div>
</body>
</html>
