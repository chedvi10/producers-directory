<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תרשים תהליכי מערכת להצעת פרויקט</title>
  <style>
    :root {
      --bg: #f7f3f7;
      --panel: #ffffff;
      --text: #2f2137;
      --muted: #6c5a72;
      --line: #e7d7ea;
      --actor-fill: #f6d9e9;
      --actor-stroke: #d99ec2;
      --process-fill: #f4e6f5;
      --process-stroke: #c88fc1;
      --store-fill: #fbe7f4;
      --store-stroke: #dca6cd;
      --arrow: #a57aa2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: radial-gradient(circle at 20% 10%, #fff9fc 0%, var(--bg) 52%);
      color: var(--text);
    }

    .shell {
      max-width: 1260px;
      margin: 26px auto;
      padding: 0 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(175, 123, 164, 0.09);
      padding: 18px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 24px;
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 8px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .diagram {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, #fffdfd 0%, #fdf5fb 100%);
      overflow-x: auto;
      padding: 8px;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 1180px;
      height: auto;
    }

    .lane-title {
      font-size: 14px;
      fill: #526a88;
      font-weight: 700;
    }

    .node-title {
      font-size: 17px;
      font-weight: 700;
      fill: #1d2f44;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node-sub {
      font-size: 12px;
      fill: #375372;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .edge-label {
      font-size: 12px;
      font-weight: 700;
      fill: #506a88;
    }

    .note {
      margin-top: 12px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="panel">
      <h1>תרשים תהליכי מערכת (גרסה להצעת פרויקט)</h1>
      <p class="subtitle">ללא מנויים | ללא אזור אישי לרכזת | ללא שליחת פניות למפיקה | מנהלת: אישור/דחייה/מחיקה בלבד</p>

      <div class="diagram">
        <svg viewBox="0 0 1280 840" role="img" aria-label="תרשים מאוחד של תהליכי מערכת">
          <defs>
            <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L10,4 L0,8 Z" fill="var(--arrow)" />
            </marker>
          </defs>

          <!-- Top title -->
          <rect x="420" y="20" width="440" height="54" rx="12" fill="#f4e5f2" stroke="#d6a4c9" stroke-width="2" />
          <text x="640" y="53" class="node-title">תרשים זרימה מאוחד של המערכת</text>

          <!-- Public browsing flow -->
          <rect x="70" y="120" width="300" height="86" rx="14" fill="var(--actor-fill)" stroke="var(--actor-stroke)" stroke-width="3" />
          <text x="220" y="155" class="node-title">דף הבית</text>
          <text x="220" y="182" class="node-sub">Landing Page</text>

          <rect x="430" y="120" width="320" height="86" rx="14" fill="var(--process-fill)" stroke="var(--process-stroke)" stroke-width="3" />
          <text x="590" y="155" class="node-title">חיפוש וסינון תוכניות</text>
          <text x="590" y="182" class="node-sub">תצוגת תוכניות מאושרות בלבד</text>

          <rect x="850" y="120" width="300" height="86" rx="14" fill="var(--process-fill)" stroke="var(--process-stroke)" stroke-width="3" />
          <text x="1000" y="155" class="node-title">צפייה בפרטי תוכנית</text>
          <text x="1000" y="182" class="node-sub">ללא אזור אישי</text>

          <rect x="510" y="250" width="220" height="74" rx="12" fill="#f7f7fb" stroke="#c9d6ea" stroke-width="2" />
          <text x="620" y="284" class="node-title">האם התוכנית מתאימה?</text>

          <path d="M 620 324 L 620 360" stroke="var(--arrow)" stroke-width="3" fill="none" marker-end="url(#arr)" />
          <text x="640" y="344" class="edge-label">כן</text>

          <path d="M 510 287 C 370 287, 320 330, 270 330" stroke="var(--arrow)" stroke-width="3" fill="none" marker-end="url(#arr)" />
          <text x="350" y="312" class="edge-label">לא</text>

          <rect x="250" y="360" width="270" height="78" rx="14" fill="var(--process-fill)" stroke="var(--process-stroke)" stroke-width="3" />
          <text x="385" y="390" class="node-title">חזרה לרשימת התוכניות</text>
          <text x="385" y="418" class="node-sub">חיפוש מחדש / סינון מחדש</text>

          <rect x="760" y="360" width="280" height="78" rx="14" fill="var(--store-fill)" stroke="var(--store-stroke)" stroke-width="3" />
          <text x="900" y="390" class="node-title">תצוגת פרטי תוכנית</text>
          <text x="900" y="418" class="node-sub">מצב: approved</text>

          <!-- Producer branch -->
          <rect x="919" y="500" width="260" height="82" rx="14" fill="var(--actor-fill)" stroke="var(--actor-stroke)" stroke-width="3" />
          <text x="1049" y="540" class="node-title">מפיקה</text>
          <text x="1049" y="568" class="node-sub">Login / Register</text>

          <rect x="690" y="500" width="170" height="82" rx="14" fill="var(--process-fill)" stroke="var(--process-stroke)" stroke-width="3" />
          <text x="775" y="538" class="node-title">ניהול תוכניות</text>
          <text x="775" y="566" class="node-sub">הוספה / עריכה / מחיקה</text>

          <rect x="420" y="500" width="210" height="82" rx="14" fill="var(--store-fill)" stroke="var(--store-stroke)" stroke-width="3" />
          <text x="525" y="538" class="node-title">מאגר תוכניות</text>
          <text x="525" y="566" class="node-sub">pending / approved / rejected</text>

          <rect x="128" y="500" width="220" height="82" rx="14" fill="var(--process-fill)" stroke="var(--process-stroke)" stroke-width="3" />
          <text x="238" y="538" class="node-title">עדכון תוכנית</text>
          <text x="238" y="566" class="node-sub">מעדכון שדה תוכן</text>

          <!-- Admin branch -->
          <rect x="910" y="660" width="280" height="82" rx="14" fill="var(--actor-fill)" stroke="var(--actor-stroke)" stroke-width="3" />
          <text x="1050" y="700" class="node-title">מנהלת</text>
          <text x="1050" y="728" class="node-sub">כניסה למערכת</text>

          <rect x="610" y="660" width="220" height="82" rx="14" fill="var(--process-fill)" stroke="var(--process-stroke)" stroke-width="3" />
          <text x="720" y="698" class="node-title">ביקורת תוכניות</text>
          <text x="720" y="726" class="node-sub">אישור / דחייה / מחיקה</text>

          <rect x="300" y="660" width="220" height="82" rx="14" fill="var(--store-fill)" stroke="var(--store-stroke)" stroke-width="3" />
          <text x="410" y="698" class="node-title">סטטוס תוכנית</text>
          <text x="410" y="726" class="node-sub">מתעדכן במאגר</text>

          <!-- flow arrows -- public -->
          <line x1="370" y1="163" x2="430" y2="163" stroke="var(--arrow)" stroke-width="3" marker-end="url(#arr)" />
          <text x="398" y="150" class="edge-label">מעבר</text>

          <line x1="750" y1="163" x2="850" y2="163" stroke="var(--arrow)" stroke-width="3" marker-end="url(#arr)" />
          <text x="794" y="150" class="edge-label">בחירה</text>

          <line x1="900" y1="206" x2="900" y2="360" stroke="var(--arrow)" stroke-width="3" marker-end="url(#arr)" />
          <text x="916" y="290" class="edge-label">הצגה</text>

          <line x1="620" y1="324" x2="385" y2="360" stroke="var(--arrow)" stroke-width="3" marker-end="url(#arr)" />

          <line x1="620" y1="324" x2="900" y2="360" stroke="var(--arrow)" stroke-width="3" marker-end="url(#arr)" />

          <!-- producer arrows -->
          <line x1="919" y1="541" x2="860" y2="541" stroke="var(--arrow)" stroke-width="3" marker-end="url(#arr)" />
          <text x="887" y="528" class="edge-label">פעולות</text>

          <line x1="690" y1="541" x2="630" y2="541" stroke="var(--arrow)" stroke-width="3" marker-end="url(#arr)" />
          <text x="655" y="528" class="edge-label">עדכון</text>

          <line x1="420" y1="541" x2="348" y2="541" stroke="var(--arrow)" stroke-width="3" marker-end="url(#arr)" />
          <text x="360" y="528" class="edge-label">שמור</text>

          <line x1="525" y1="582" x2="525" y2="660" stroke="var(--arrow)" stroke-width="3" marker-end="url(#arr)" />
          <text x="538" y="620" class="edge-label">בקרה</text>

          <!-- admin arrows -->
          <line x1="910" y1="701" x2="830" y2="701" stroke="var(--arrow)" stroke-width="3" marker-end="url(#arr)" />
          <text x="866" y="688" class="edge-label">החלטה</text>

          <line x1="610" y1="701" x2="520" y2="701" stroke="var(--arrow)" stroke-width="3" marker-end="url(#arr)" />
          <text x="550" y="688" class="edge-label">סטטוס</text>
        </svg>
      </div>

      <p class="note">התרשים המאוחד מציג את שני ההיבטים יחד: תצוגה ציבורית של תוכניות ושני מנגנוני ניהול בתוך המערכת — מפיקה ומנהלת — ללא מנויים, ללא אזור אישי לרכזת וללא שליחת פניות.</p>
    </div>
  </div>
</body>
</html>
