<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Use Case Diagram - מדריך תוכניות</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #f8fbff 0%, #eef5ff 100%);
      color: #1f2a37;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px;
    }

    h1 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 26px;
      color: #1e3a5f;
    }

    .sub {
      margin: 0 0 14px;
      text-align: center;
      font-size: 15px;
      color: #5d6f86;
    }

    .wrap {
      background: #ffffff;
      border: 1px solid #d8e4f5;
      border-radius: 18px;
      box-shadow: 0 14px 34px rgba(44, 83, 146, 0.12);
      padding: 12px;
      overflow: auto;
    }

    svg {
      width: 100%;
      min-width: 980px;
      height: auto;
      display: block;
    }

    .actor {
      stroke: #3f6795;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
    }

    .actor-label {
      font-size: 18px;
      font-weight: 700;
      fill: #27486e;
    }

    .system-box {
      fill: #fbfdff;
      stroke: #7f8fa6;
      stroke-width: 2.2;
      stroke-dasharray: 8 6;
    }

    .system-title {
      font-size: 26px;
      font-weight: 700;
      fill: #244767;
    }

    .uc {
      stroke-width: 2.2;
    }

    .uc-producer {
      fill: #e7f2ff;
      stroke: #5c9ddc;
    }

    .uc-coordinator {
      fill: #ede4f9;
      stroke: #a27fd1;
    }

    .uc-admin {
      fill: #ffeede;
      stroke: #f2a152;
    }

    .uc-text {
      font-size: 14px;
      font-weight: 600;
      fill: #2c3f56;
    }

    .line {
      stroke: #8a98aa;
      stroke-width: 1.8;
    }

    .note {
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
      color: #5c6b7e;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>תרשים Use Case - מדריך תוכניות</h1>
    <p class="sub">תרשים מסודר לפי סוגי משתמשים ופעולות עיקריות במערכת</p>

    <div class="wrap">
      <svg viewBox="0 0 1220 860" aria-label="Use case diagram">
        <rect class="system-box" x="250" y="42" width="720" height="760" />
        <text class="system-title" x="610" y="82" text-anchor="middle">מערכת מדריך תוכניות</text>

        <g transform="translate(1105 215)">
          <circle class="actor" cx="0" cy="0" r="22" />
          <line class="actor" x1="0" y1="22" x2="0" y2="98" />
          <line class="actor" x1="-38" y1="52" x2="38" y2="52" />
          <line class="actor" x1="0" y1="98" x2="-32" y2="142" />
          <line class="actor" x1="0" y1="98" x2="32" y2="142" />
          <text class="actor-label" x="0" y="172" text-anchor="middle">מפיקה</text>
        </g>

        <g transform="translate(105 330)">
          <circle class="actor" cx="0" cy="0" r="22" />
          <line class="actor" x1="0" y1="22" x2="0" y2="98" />
          <line class="actor" x1="-38" y1="52" x2="38" y2="52" />
          <line class="actor" x1="0" y1="98" x2="-32" y2="142" />
          <line class="actor" x1="0" y1="98" x2="32" y2="142" />
          <text class="actor-label" x="0" y="172" text-anchor="middle">רכזת</text>
        </g>

        <g transform="translate(610 690)">
          <circle class="actor" cx="0" cy="0" r="20" />
          <line class="actor" x1="0" y1="20" x2="0" y2="90" />
          <line class="actor" x1="-34" y1="50" x2="34" y2="50" />
          <line class="actor" x1="0" y1="90" x2="-30" y2="130" />
          <line class="actor" x1="0" y1="90" x2="30" y2="130" />
          <text class="actor-label" x="0" y="156" text-anchor="middle">מנהל מערכת</text>
        </g>

        <!-- Producer use cases -->
        <ellipse class="uc uc-producer" cx="760" cy="130" rx="92" ry="26" />
        <text class="uc-text" x="760" y="136" text-anchor="middle">רישום</text>

        <ellipse class="uc uc-producer" cx="760" cy="200" rx="92" ry="26" />
        <text class="uc-text" x="760" y="206" text-anchor="middle">התחברות</text>

        <ellipse class="uc uc-producer" cx="760" cy="270" rx="102" ry="28" />
        <text class="uc-text" x="760" y="276" text-anchor="middle">הוספת תוכנית</text>

        <ellipse class="uc uc-producer" cx="760" cy="340" rx="102" ry="28" />
        <text class="uc-text" x="760" y="346" text-anchor="middle">עריכת תוכנית</text>

        <ellipse class="uc uc-producer" cx="760" cy="410" rx="102" ry="28" />
        <text class="uc-text" x="760" y="416" text-anchor="middle">מחיקת תוכנית</text>

        <!-- Coordinator use cases -->
        <ellipse class="uc uc-coordinator" cx="430" cy="270" rx="104" ry="26" />
        <text class="uc-text" x="430" y="276" text-anchor="middle">חיפוש תוכנית</text>

        <ellipse class="uc uc-coordinator" cx="430" cy="340" rx="108" ry="26" />
        <text class="uc-text" x="430" y="346" text-anchor="middle">סינון תוכניות</text>

        <ellipse class="uc uc-coordinator" cx="430" cy="410" rx="126" ry="28" />
        <text class="uc-text" x="430" y="416" text-anchor="middle">צפייה בפרטי תוכנית</text>

        <!-- Admin use cases -->
        <ellipse class="uc uc-admin" cx="435" cy="620" rx="78" ry="24" />
        <text class="uc-text" x="440" y="626" text-anchor="middle">אישור תוכנית</text>

        <ellipse class="uc uc-admin" cx="610" cy="590" rx="78" ry="24" />
        <text class="uc-text" x="610" y="596" text-anchor="middle">דחיית תוכנית</text>

        <ellipse class="uc uc-admin" cx="785" cy="620" rx="78" ry="24" />
        <text class="uc-text" x="780" y="626" text-anchor="middle">מחיקת תוכנית</text>

        <!-- Producer connections -->
        <line class="line" x1="1068" y1="205" x2="852" y2="130" />
        <line class="line" x1="1068" y1="215" x2="852" y2="200" />
        <line class="line" x1="1068" y1="225" x2="862" y2="270" />
        <line class="line" x1="1068" y1="235" x2="862" y2="340" />
        <line class="line" x1="1068" y1="245" x2="862" y2="410" />

        <!-- Coordinator connections -->
        <line class="line" x1="145" y1="330" x2="326" y2="270" />
        <line class="line" x1="145" y1="340" x2="322" y2="340" />
        <line class="line" x1="145" y1="350" x2="304" y2="410" />

        <!-- Admin connections -->
        <line class="line" x1="610" y1="660" x2="510" y2="640" />
        <line class="line" x1="610" y1="660" x2="610" y2="624" />
        <line class="line" x1="610" y1="660" x2="710" y2="640" />
      </svg>
    </div>

    <div class="note">מומלץ לייצא כ-PDF או לצלם כתמונה ולהוסיף למסמך ההצעה.</div>
  </div>
</body>
</html>
