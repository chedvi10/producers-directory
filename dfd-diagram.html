<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Flow Diagram (DFD) - ללא מנויים</title>
  <style>
    :root {
      --bg: #f4f7fc;
      --card: #ffffff;
      --text: #1f3147;
      --muted: #5f738d;
      --line: #4f6f95;
      --ext-fill: #fff9d9;
      --ext-stroke: #8a7a2f;
      --proc1-fill: #dfefff;
      --proc2-fill: #eee2fb;
      --proc3-fill: #ffeccf;
      --store-fill: #f3f7fd;
      --store-stroke: #6c88aa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 14px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg), #e9f0fb);
      color: var(--text);
    }

    .container {
      max-width: 1500px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 14px;
      border: 1px solid #d6e1f0;
      box-shadow: 0 10px 28px rgba(20, 45, 80, 0.1);
      padding: 18px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 32px;
      color: #1d466f;
    }

    .sub {
      text-align: center;
      margin: 8px 0 14px;
      color: var(--muted);
      font-size: 14px;
    }

    svg {
      width: 100%;
      height: auto;
      border: 1px solid #d5e0ef;
      border-radius: 10px;
      background: #fcfeff;
      display: block;
    }

    .ext {
      fill: var(--ext-fill);
      stroke: var(--ext-stroke);
      stroke-width: 2;
      rx: 10;
    }

    .proc {
      stroke: #6f7f96;
      stroke-width: 2;
    }

    .store {
      fill: var(--store-fill);
      stroke: var(--store-stroke);
      stroke-width: 2;
      rx: 8;
    }

    .lbl {
      font-size: 22px;
      font-weight: 700;
      fill: #243a56;
    }

    .txt {
      font-size: 16px;
      fill: #344f71;
    }

    .flow {
      stroke: var(--line);
      stroke-width: 2.2;
      fill: none;
      marker-end: url(#arrow);
    }

    .flow-label {
      font-size: 14px;
      fill: #4c6282;
      font-weight: 600;
    }

    .caption {
      margin-top: 10px;
      text-align: center;
      color: #516b8a;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Data Flow Diagram (DFD) - רמה 1</h1>
    <p class="sub">גרסה ללא מנויים: הוסר מאגר Subscriptions וכל זרימה הקשורה למנוי</p>

    <svg viewBox="0 0 1800 980" xmlns="http://www.w3.org/2000/svg" aria-label="DFD without subscriptions">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
          <polygon points="0 0, 10 3, 0 6" fill="#4f6f95" />
        </marker>
      </defs>

      <!-- External entities -->
      <rect class="ext" x="70" y="260" width="240" height="86" />
      <text class="lbl" x="190" y="312" text-anchor="middle">רכזת / אורחת</text>

      <rect class="ext" x="1490" y="90" width="240" height="86" />
      <text class="lbl" x="1610" y="142" text-anchor="middle">מפיקה</text>

      <rect class="ext" x="1490" y="360" width="240" height="86" />
      <text class="lbl" x="1610" y="412" text-anchor="middle">מנהלת</text>

      <rect class="ext" x="70" y="500" width="240" height="86" />
      <text class="lbl" x="190" y="552" text-anchor="middle">SMTP / Email</text>

      <!-- Processes -->
      <ellipse class="proc" cx="900" cy="130" rx="220" ry="62" fill="var(--proc1-fill)" />
      <text class="lbl" x="900" y="122" text-anchor="middle">1.0 אימות והרשאות</text>
      <text class="txt" x="900" y="146" text-anchor="middle">JWT + בקרת גישה</text>

      <ellipse class="proc" cx="900" cy="300" rx="220" ry="62" fill="var(--proc2-fill)" />
      <text class="lbl" x="900" y="292" text-anchor="middle">2.0 חיפוש וסינון תוכניות</text>
      <text class="txt" x="900" y="316" text-anchor="middle">שאילתות ופילטרים</text>

      <ellipse class="proc" cx="900" cy="470" rx="220" ry="62" fill="var(--proc1-fill)" />
      <text class="lbl" x="900" y="462" text-anchor="middle">3.0 ניהול תוכניות</text>
      <text class="txt" x="900" y="486" text-anchor="middle">יצירה/עריכה/מחיקה, pending</text>

      <ellipse class="proc" cx="900" cy="640" rx="220" ry="62" fill="var(--proc3-fill)" />
      <text class="lbl" x="900" y="632" text-anchor="middle">4.0 בקרת איכות ואישור</text>
      <text class="txt" x="900" y="656" text-anchor="middle">אישור או דחייה של תוכניות</text>

      <!-- Data stores -->
      <rect class="store" x="450" y="830" width="220" height="68" />
      <text class="lbl" x="560" y="872" text-anchor="middle">D1 Producers</text>

      <rect class="store" x="700" y="830" width="220" height="68" />
      <text class="lbl" x="810" y="872" text-anchor="middle">D2 Programs</text>

      <rect class="store" x="950" y="830" width="220" height="68" />
      <text class="lbl" x="1060" y="872" text-anchor="middle">D3 SavedPrograms</text>

      <rect class="store" x="1200" y="830" width="220" height="68" />
      <text class="lbl" x="1310" y="872" text-anchor="middle">D4 Inquiries</text>

      <!-- Flows -->
      <line class="flow" x1="1490" y1="133" x2="1122" y2="133" />
      <text class="flow-label" x="1296" y="120" text-anchor="middle">הרשמה/התחברות</text>

      <line class="flow" x1="678" y1="150" x2="310" y2="260" />
      <text class="flow-label" x="470" y="190" text-anchor="middle">טוקן/שגיאה</text>

      <line class="flow" x1="310" y1="303" x2="680" y2="286" />
      <text class="flow-label" x="486" y="275" text-anchor="middle">קריטריוני חיפוש</text>

      <line class="flow" x1="1120" y1="300" x2="1490" y2="300" />
      <text class="flow-label" x="1302" y="286" text-anchor="middle">תוצאות חיפוש</text>

      <line class="flow" x1="1490" y1="133" x2="1118" y2="470" />
      <text class="flow-label" x="1310" y="300" text-anchor="middle">ניהול תוכנית</text>

      <line class="flow" x1="900" y1="532" x2="810" y2="830" />
      <text class="flow-label" x="840" y="700" text-anchor="middle">כתיבה/עדכון</text>

      <line class="flow" x1="1490" y1="403" x2="1122" y2="640" />
      <text class="flow-label" x="1300" y="510" text-anchor="middle">החלטת אישור/דחייה</text>

      <line class="flow" x1="900" y1="702" x2="810" y2="830" />
      <text class="flow-label" x="860" y="770" text-anchor="middle">עדכון סטטוס</text>

      <line class="flow" x1="680" y1="640" x2="310" y2="543" />
      <text class="flow-label" x="486" y="585" text-anchor="middle">בקשת מייל</text>

      <line class="flow" x1="1120" y1="640" x2="1490" y2="640" />
      <text class="flow-label" x="1300" y="626" text-anchor="middle">סטטוס סופי למפיקה</text>

      <line class="flow" x1="980" y1="300" x2="810" y2="830" />
      <text class="flow-label" x="930" y="580" text-anchor="middle">קריאת Programs</text>

      <line class="flow" x1="980" y1="470" x2="1060" y2="830" />
      <text class="flow-label" x="1026" y="690" text-anchor="middle">שמירות</text>

      <line class="flow" x1="980" y1="640" x2="1310" y2="830" />
      <text class="flow-label" x="1160" y="760" text-anchor="middle">פניות</text>
    </svg>

    <div class="caption">התרשים מציג DFD ברמה 1 ללא רכיב מנויים.</div>
  </div>
</body>
</html>
